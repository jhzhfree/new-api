name: Governance integration validation

on:
  push:
    branches: [feature/enterprise-governance-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
      - name: Build pinned upstream migration fixture
        run: |
          git fetch --no-tags https://github.com/QuantumNous/new-api.git 706144769e5bed5a47b78721e3bb11da3cf4c0b9
          git worktree add --detach "$RUNNER_TEMP/new-api-baseline" FETCH_HEAD
          cd "$RUNNER_TEMP/new-api-baseline"
          go build -mod=readonly -o "$RUNNER_TEMP/newapi-baseline-migrate" "$GITHUB_WORKSPACE/scripts/testdata/governance_baseline/main.go"
          echo "TEST_GOVERNANCE_BASELINE_BINARY=$RUNNER_TEMP/newapi-baseline-migrate" >> "$GITHUB_ENV"
      - name: Race-check execution boundary and service regressions
        run: go test -race ./common ./middleware ./model ./relay/common ./relay/channel ./relay/channel/openai ./relay/channel/claude ./relay/channel/deepseek ./service -count=1
      - name: Controller race regressions
        run: go test -race ./controller -count=1 -timeout=15m
      - name: Build validation binary (not a release package)
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go build -mod=readonly .
          go build -mod=readonly -o "$RUNNER_TEMP/newapi-governance-server" ./scripts/testdata/governance_server
